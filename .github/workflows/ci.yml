name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python test tools
        run: python -m pip install --disable-pip-version-check pytest ruff

      - name: Run tests
        run: pytest tests/ -q

      - name: Run ShellCheck
        run: shellcheck lib/*.sh bin/huddle-hook

      - name: Run Ruff
        run: ruff check .
